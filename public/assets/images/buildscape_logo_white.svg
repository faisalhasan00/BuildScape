<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 650 180' width='100%' height='100%'>
  <defs>
    <linearGradient id='goldGradW' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#f7df94'/>
      <stop offset='30%' stop-color='#d4af37'/>
      <stop offset='70%' stop-color='#aa7c11'/>
      <stop offset='100%' stop-color='#f7df94'/>
    </linearGradient>
    <linearGradient id='goldTextW' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#faeeab'/>
      <stop offset='45%' stop-color='#d4af37'/>
      <stop offset='100%' stop-color='#b58914'/>
    </linearGradient>
  </defs>

  <g transform='translate(10, 10)'>
    <!-- Arch outer frame -->
    <path d='M 10 150 L 10 70 A 70 70 0 0 1 150 70 L 150 150 Z' fill='#1c1c1c' stroke='url(#goldGradW)' stroke-width='8'/>
    <path d='M 16 148 L 16 72 A 64 64 0 0 1 144 72 L 144 148 Z' fill='none' stroke='#d4af37' stroke-width='2'/>
    
    <!-- Building Grid Left & Right -->
    <rect x='30' y='75' width='28' height='70' fill='none' stroke='#ffffff' stroke-width='2'/>
    <line x1='30' y1='90' x2='58' y2='90' stroke='#ffffff' stroke-width='1.5'/>
    <line x1='30' y1='105' x2='58' y2='105' stroke='#ffffff' stroke-width='1.5'/>
    <line x1='30' y1='120' x2='58' y2='120' stroke='#ffffff' stroke-width='1.5'/>
    <line x1='30' y1='135' x2='58' y2='135' stroke='#ffffff' stroke-width='1.5'/>
    <line x1='44' y1='75' x2='44' y2='145' stroke='#ffffff' stroke-width='1.5'/>

    <rect x='102' y='70' width='28' height='75' fill='none' stroke='#ffffff' stroke-width='2'/>
    <rect x='107' y='76' width='8' height='9' fill='#ffffff'/>
    <rect x='117' y='76' width='8' height='9' fill='#ffffff'/>
    <rect x='107' y='90' width='8' height='9' fill='#ffffff'/>
    <rect x='117' y='90' width='8' height='9' fill='#ffffff'/>
    <rect x='107' y='104' width='8' height='9' fill='#ffffff'/>
    <rect x='117' y='104' width='8' height='9' fill='#ffffff'/>
    <rect x='107' y='118' width='8' height='9' fill='#ffffff'/>
    <rect x='117' y='118' width='8' height='9' fill='#ffffff'/>

    <!-- Compass & Monogram -->
    <path d='M 80 18 L 65 58 L 95 58 Z' fill='none' stroke='#d4af37' stroke-width='2.5'/>
    <circle cx='80' cy='18' r='5' fill='#d4af37'/>
    <line x1='80' y1='8' x2='80' y2='18' stroke='#d4af37' stroke-width='2.5'/>
    <line x1='60' y1='58' x2='100' y2='58' stroke='#d4af37' stroke-width='2.5'/>
    <text x='80' y='55' font-family='Oswald, sans-serif' font-size='28' font-weight='bold' fill='#ffffff' text-anchor='middle'>BSE</text>
  </g>

  <!-- Typography Right -->
  <!-- BUILDSCAPE -->
  <text x='180' y='78' font-family='Cinzel, Times New Roman, serif' font-size='48' font-weight='900' letter-spacing='5' fill='url(#goldTextW)'>BUILDSCAPE</text>

  <!-- ARCHITECTS & ENGINEER'S -->
  <text x='182' y='118' font-family='Oswald, sans-serif' font-size='24' font-weight='700' letter-spacing='3.5' fill='#ffffff'>ARCHITECTS &amp; ENGINEER'S</text>

  <!-- Script Subtitle -->
  <text x='184' y='154' font-family='Great Vibes, Dancing Script, cursive' font-size='30' font-style='italic' fill='#d4af37'>Masters Of Consistency &amp; Quality</text>
</svg>